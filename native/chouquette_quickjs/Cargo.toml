[package]
name = "chouquette_quickjs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Runs chouquette apps on QuickJS inside levain's host"

[dependencies]
levain = { workspace = true }
base64 = "0.23"
getrandom = "0.4"
rquickjs = "0.14"
serde_json = "1"
# fetch: HTTP on a worker thread, answered through the JS thread's event loop.
ureq = "3"
url = "2"

[dev-dependencies]
tempfile = "3"

# rquickjs ships prebuilt bindings for desktops only: phones generate theirs.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }
