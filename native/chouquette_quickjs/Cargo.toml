[package]
name = "chouquette_quickjs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Runs chouquette apps on QuickJS inside levain's host"

[dependencies]
levain = { workspace = true }
rquickjs = "0.14"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# rquickjs ships prebuilt bindings for desktops only: phones generate theirs.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen"] }
