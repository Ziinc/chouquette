[package]
name = "chouquette_ios"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The iOS app's Rust half: the Tauri project `levain-pack` builds, whose Xcode
# project links this static library. It is the host (`chouquette_host`) and
# nothing else; it exists because a library crate's types can't vary by
# target, and the host's `cdylib` (for Android) can't link for iOS.
# Generated by `levain-pack ios-crate`.
[lib]
name = "chouquette_ios_lib"
crate-type = ["staticlib"]
test = false
doctest = false

[dependencies]
chouquette_host = { path = "../chouquette_host", default-features = false }
tauri = { version = "2.12", default-features = false }

[features]
default = []
playwright = ["chouquette_host/playwright"]
