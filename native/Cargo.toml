[workspace]
resolver = "3"
members = ["chouquette_quickjs", "chouquette_host", "chouquette_ios"]
# The iOS wrapper is built for iOS only (levain-pack), not on desktops.
default-members = ["chouquette_quickjs", "chouquette_host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ziinc/chouquette"

[workspace.dependencies]
levain = { git = "https://github.com/Ziinc/levain", rev = "53738e5a7cfcc5d6275b2b3c79c31ca81464c5c7" }

# As levain's own workspace: gpui-kit 0.7.3 plus the painted-text observation
# gpui-playwright reads.
[patch.crates-io]
gpui-kit = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-base = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-component = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-component-macros = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }
gpui-kit-assets = { git = "https://github.com/Ziinc/gpui-kit", rev = "7ea1125954e6701d849fd448aab08ab2ac63d07f" }

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
strip = true
