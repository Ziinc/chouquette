name: node

# The embedded Node runtime (the MVP gate): its tests and the counter end to
# end on desktop, against libnode from libnode.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  libnode:
    uses: ./.github/workflows/libnode.yml

  test:
    needs: libnode
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: node
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: libnode-${{ runner.os }}
          path: ${{ runner.temp }}/libnode
      - name: System dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libssl-dev libxkbcommon-dev libxkbcommon-x11-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libgbm-dev \
            libegl-dev libxrandr-dev clang fonts-dejavu xvfb
      - run: echo "CHOUQUETTE_LIBNODE=$RUNNER_TEMP/libnode" >> "$GITHUB_ENV"
      # Windows finds libnode.dll on PATH.
      - if: runner.os == 'Windows'
        run: echo "$RUNNER_TEMP/libnode/lib" >> "$GITHUB_PATH"
      - run: npm ci
      - run: cargo test -p chouquette_node
        working-directory: native
      # The M7 gate on desktop: create-next-app's starter, config changes only.
      - run: cargo build -p chouquette_host --features playwright
        working-directory: native
      - name: Libnode beside the host
        run: cp -P "$RUNNER_TEMP"/libnode/lib/* native/target/debug/
      # The Windows runner has no GPU: Mesa's software drivers beside the host.
      - name: Mesa
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 26.2.5 -R pal1000/mesa-dist-win -p '*-release-msvc.7z' -O "$RUNNER_TEMP/mesa.7z"
          7z x -y -o"$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa.7z" >/dev/null
          cp "$RUNNER_TEMP"/mesa/x64/*.dll native/target/debug/
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
      - name: The Next.js starter end to end
        working-directory: examples/next-starter
        env:
          CI: "1"
          VK_ICD_FILENAMES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.json' || '' }}
        run: |
          npm run build
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test --trace off
          else npx playwright test --trace off; fi
